appId: com.pskmoons.meteocat
---
# The Radar tab: RainViewer radar over the map, with the time slider. Needs network. Build without Thread Sanitizer
# (xcodebuild ... ENABLE_THREAD_SANITIZER=NO) if MapKit's renderer crashes under it in the simulator.
- launchApp:
    clearState: true
- tapOn: "Radar"
- extendedWaitUntil:
    visible:
      id: "map.play"
    timeout: 30000
- assertVisible:
    id: "map.view"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: radar
- tapOn:
    id: "map.radar"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: radar_off
